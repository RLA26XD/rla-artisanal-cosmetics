services:
  - type: web
    name: rla-cosmetics
    env: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && python init_render_db.py
    startCommand: gunicorn -c gunicorn.conf.py wsgi:app
    envVars:
      - key: FLASK_APP
        value: app.py
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/src/instance/cosmetics.db
      - key: DASH_DEBUG
        value: False
    autoDeploy: true
