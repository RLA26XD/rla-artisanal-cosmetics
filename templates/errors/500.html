{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}

<section class="py-20 bg-cream min-h-screen flex items-center">
    <div class="max-w-2xl mx-auto px-4 text-center">
        <h1 class="font-playfair text-9xl font-bold text-emerald-deep mb-4">500</h1>
        <h2 class="text-3xl font-bold text-emerald-deep mb-6">Internal Server Error</h2>
        <p class="text-xl text-gray-600 mb-8">Something went wrong on our end. We're working to fix it.</p>
        <a href="{{ url_for('main.index') }}" class="inline-block bg-emerald-deep text-white px-8 py-4 rounded-full font-bold hover:bg-emerald-900 transition">
            Return Home
        </a>
    </div>
</section>

{% endblock %}
