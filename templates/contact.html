{% extends "base.html" %}

{% block title %}Contact Us - RLA Artisanal Cosmetics{% endblock %}

{% block content %}

<section class="py-20 bg-cream">
    <div class="max-w-4xl mx-auto px-4">
        <h1 class="font-playfair text-5xl font-bold text-emerald-deep mb-12 text-center">Get In Touch</h1>
        
        <div class="bg-white rounded-3xl shadow-lg p-8">
            <form class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-emerald-deep mb-2">Name</label>
                    <input type="text" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-saffron focus:border-transparent">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-emerald-deep mb-2">Email</label>
                    <input type="email" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-saffron focus:border-transparent">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-emerald-deep mb-2">Message</label>
                    <textarea rows="6" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-saffron focus:border-transparent"></textarea>
                </div>
                
                <button type="submit" class="w-full bg-emerald-deep text-white py-4 rounded-full font-bold text-lg hover:bg-emerald-900 transition">
                    Send Message
                </button>
            </form>
        </div>
    </div>
</section>

{% endblock %}
